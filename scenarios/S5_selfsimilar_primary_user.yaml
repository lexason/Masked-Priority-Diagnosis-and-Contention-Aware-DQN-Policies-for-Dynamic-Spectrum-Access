# Scenario S5 — Self-Similar Traffic + Primary User Protection
# Tests DQN's ability to protect a licensed primary user on channel 2.
# Self-similar traffic (Hurst H=0.8) emulates realistic long-range dependent traffic.
#
# Metrics targets: utilisation ≥ 85%, Jain fairness ≥ 0.88, PU violations = 0
# RQ2 relevance: primary user protection — critical IEEE spectrum sharing requirement

name: S5_selfsimilar_primary_user
description: >
  Self-similar traffic (H=0.8, 70% occupancy) with a primary user on channel 2
  (70% duty cycle). Agents must learn to avoid channel 2 when PU is active.

# ─── Traffic model ──────────────────────────────────────────────────────────
traffic_model: self_similar
occupancy_pct: 70
holding_time_s: 2.0
hurst_parameter: 0.8            # H > 0.5 → long-range dependence (bursty traffic)

# ─── Interference model ─────────────────────────────────────────────────────
interference_model: awgn
snr_db: 2.0
tone_channel: null

# ─── Channel configuration ──────────────────────────────────────────────────
n_channels: 6
channel_spacing_mhz: 10.0
base_freq_mhz: 2400.0

# ─── Primary user ───────────────────────────────────────────────────────────
primary_user_channel: 2         # channel 2 (2420 MHz) is licensed to a primary user
primary_user_duty_cycle: 0.7    # PU active 70% of the time

# ─── RF power parameters ────────────────────────────────────────────────────
noise_floor_dbm: -100.0
signal_power_min_dbm: -65.0
signal_power_max_dbm: -35.0

# ─── Experiment metadata ────────────────────────────────────────────────────
seed: 42
duration_s: 300
node_count: 15

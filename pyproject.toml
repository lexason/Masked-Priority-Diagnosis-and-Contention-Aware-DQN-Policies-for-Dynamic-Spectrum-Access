[project]
name = "chainradionet"
version = "0.1.0"
description = "Blockchain-Orchestrated Cloud-SDR Framework for Decentralised Dynamic Spectrum Sharing"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dr. Asuquo Okon" },
]
license = { text = "MIT" }
dependencies = [
    # AI / ML — CPU-only build (Intel Core Ultra 9 285 — no CUDA, Intel Arc Xe integrated)
    "torch>=2.3.0",
    "torch-geometric>=2.5.0",
    # Web / API serving
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation and settings management
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Structured logging — never use print() or stdlib logging
    "structlog>=24.2.0",
    # Async HTTP client for inter-service communication
    "httpx>=0.27.0",
    # Numerics
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # Configuration / serialisation
    "pyyaml>=6.0.1",
    # Observability
    "prometheus-client>=0.20.0",
    # Analysis and publication figures (Jupyter notebooks)
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "httpx>=0.27.0",  # needed by FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit package list — all top-level source packages in this repo
packages = ["ai", "sdr"]

# ─── uv: route torch through PyTorch CPU wheel index ─────────────────────────
# Dell Tower has Intel Arc Xe integrated graphics only — CUDA unavailable.
# CPU build is sufficient: DQN inference < 1ms on Core Ultra 9 285.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

# ─── Ruff linter + formatter ──────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations — enforce type hints on all functions
    "B",    # flake8-bugbear — common bug patterns
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
]
ignore = [
    "ANN204",  # Missing return type annotation for __init__ / __new__
    "ANN401",  # Allow Any in some cases (torch internals, dynamic dispatch)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["ANN"]  # Relax annotation requirements in test files

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "sdr/tests",
    "ai/tests",
    "blockchain/tests",
    "bridge/tests",
    "attack_sim/tests",
]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:torch",
]

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = [
    "sdr/flowgraphs/",   # GNU Radio auto-generated Python — not type-checked
    "analysis/",         # Jupyter notebooks
    "experiments/",      # Ad-hoc experiment runners
]

[dependency-groups]
dev = [
    "statsmodels>=0.14.6",
]
